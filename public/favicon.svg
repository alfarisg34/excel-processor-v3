<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="excel-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="blue-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#bg-grad)" stroke="#334155" stroke-width="1.5" />

  <!-- Excel Sheet Symbol (Left / Back) -->
  <g filter="url(#shadow)">
    <rect x="12" y="14" width="26" height="32" rx="4" fill="url(#excel-grad)" />
    <!-- Grid lines on sheet -->
    <line x1="17" y1="22" x2="33" y2="22" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.8"/>
    <line x1="17" y1="28" x2="33" y2="28" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.8"/>
    <line x1="17" y1="34" x2="33" y2="34" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.8"/>
    <line x1="17" y1="40" x2="27" y2="40" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.8"/>
  </g>

  <!-- Bar Chart / Processor Symbol (Right / Front) -->
  <g filter="url(#shadow)">
    <!-- Bar 1 -->
    <rect x="32" y="32" width="6" height="18" rx="2" fill="#38bdf8" />
    <!-- Bar 2 -->
    <rect x="40" y="24" width="6" height="26" rx="2" fill="#60a5fa" />
    <!-- Bar 3 -->
    <rect x="48" y="16" width="6" height="34" rx="2" fill="#818cf8" />
    <!-- Sparkle / Modern Accent -->
    <circle cx="48" cy="14" r="2" fill="#fbbf24" />
  </g>
</svg>
